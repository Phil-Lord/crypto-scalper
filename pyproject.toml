[project]
name = "crypto-scalper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "optuna>=4.0",
    "optuna-dashboard>=0.19",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "requests>=2.30",
    "seaborn>=0.13",
    "sqlalchemy>=2.0",
    "supabase>=2.0",
    "tenacity>=9.0",
    "tqdm>=4.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "pytest>=8.0",
    "pytest-mock>=3.0",
]
docs = [
    "markdown-graphviz-inline>=1.1",
    "mdx-truly-sane-lists>=1.3",
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocs-monorepo-plugin>=1.0",
    "mkdocs-redirects>=1.2",
    "plantuml-markdown>=3.9",
]

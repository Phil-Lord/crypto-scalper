[pytest]
pythonpath = scalper
testpaths = scalper/tests
markers =
    # Integration Tests
    integration: Integration tests that verify multiple layers work together (mocks only system boundaries).
    data_system_integration: Integration tests for the data system module.
    exchange_connector_integration: Integration tests for the exchange connector module.
    exchange_connector_data_system_integration: Integration tests for Exchange Connector <-> Data System interaction.
    strategy_manager_integration: Integration tests for the strategy manager module.
    backtesting_engine_integration: Integration tests for the backtesting engine module.
    trade_executor_integration: Integration tests for the trade executor module.

    # Backtesting Engine - Module & Categories
    backtesting_engine: Tests for the backtesting engine module.
    objective: Tests for the objective function and optimisation logic.
    parameter_optimisation: Tests for parameter optimisation utilities.
    profit_calculation: Tests for profit calculation functions.
    generalisation_evaluation: Tests for generalisation evaluation functions.

    # Backtesting Engine - Specific Functions
    run: Tests for the run method.
    set_ohlc_window: Tests for the set_ohlc_window method.
    calculate_position_profits: Tests for the calculate_position_profits function.
    get_final_quote_balance: Tests for the get_final_quote_balance function.
    load_ohlc_data: Tests for OHLC data loading.
    get_objective
    calculate_penalty

    # Utils
    utils: Tests for the utils module.
    timestamp_conversion: Tests for timestamp conversion utilities.
    parse_datetime
    get_nano_timestamp
    get_second_timestamp
    pair_config: Tests for pair configuration utilities.
    env_vars: Tests for environment variable utilities.
    data_visualisation: Tests for data visualisation utilities.

    # Trade Executor
    trade_executor: Tests for the TradeExecutor class.
    execute_interval
    position_sizer: Tests for the PositionSizer classes.
    reconcile_placed_orders: Tests for order reconciliation logic.

    # Exchange Connector - Module & Categories
    exchange_connector: Tests for the exchange connector module.
    api: Tests for API client classes.
    connectors: Tests for connector classes.
    services: Tests for service classes.
    kraken_utils: Tests for Kraken utility functions.

    # Exchange Connector - API
    kraken_api_client: Tests for the KrakenApiClient class.
    kraken_too_many_requests_error: Tests for the KrakenTooManyRequestsError exception.

    # Exchange Connector - Connectors
    add_order_connector: Tests for the AddOrderConnector class.
    asset_pairs_connector: Tests for the AssetPairsConnector class.
    balance_connector: Tests for the BalanceConnector class.
    ohlc_connector: Tests for the OhlcConnector class.
    query_orders_connector: Tests for the QueryOrdersConnector class.
    ticker_connector: Tests for the TickerConnector class.
    trades_connector: Tests for the TradesConnector class.

    # Exchange Connector - Services
    kraken_service: Tests for the KrakenService class.
    add_order_service: Tests for the AddOrderService class.
    asset_pairs_service: Tests for the AssetPairsService class.
    balance_service: Tests for the BalanceService class.
    ohlc_service: Tests for the OhlcService class.
    query_orders_service: Tests for the QueryOrdersService class.
    ticker_service: Tests for the TickerService class.
    trades_service: Tests for the TradesService class.

    # Exchange Connector - Utils
    kraken_auth_utils: Tests for the Kraken authentication utilities.

    # Data System - Module & Categories
    data_system: Tests for the data system module.
    clients: Tests for client classes.
    config: Tests for configuration classes.
    models: Tests for model/dataclass classes.
    repositories: Tests for repository classes.

    # Data System - Clients
    sqlalchemy_client: Tests for the SQLAlchemyClient class.
    supabase_client: Tests for the SupabaseClient class.

    # Data System - Config
    local_sqlite_config: Tests for the LocalSQLiteConfig class.
    supabase_config: Tests for the SupabaseConfig class.

    # Data System - Models
    bot_model: Tests for the Bot dataclass.
    bot_order_model: Tests for the BotOrder dataclass.
    bot_run_model: Tests for the BotRun dataclass.
    bot_tick_model: Tests for the BotTick dataclass.
    generalisation_evaluation_model: Tests for the GeneralisationEvaluation dataclass.
    trade_model: Tests for the Trade dataclass.

    # Data System - Repositories
    supabase_bot_repository: Tests for the SupabaseBotRepository class.
    supabase_bot_order_repository: Tests for the SupabaseBotOrderRepository class.
    supabase_bot_run_repository: Tests for the SupabaseBotRunRepository class.
    supabase_bot_tick_repository: Tests for the SupabaseBotTickRepository class.
    sqlalchemy_generalisation_evaluation_repository: Tests for the SQLAlchemyGeneralisationEvaluationRepository class.
    sqlalchemy_trade_repository: Tests for the SQLAlchemyTradeRepository class.

    # Strategy Manager - Module & Categories
    strategy_manager: Tests for the strategy manager module.
    indicators: Tests for indicator classes.
    rules: Tests for rule classes.
    strategies: Tests for strategy classes.

    # Strategy Manager - Indicators
    sma_indicator: Tests for the SmaIndicator class.
    ema_indicator: Tests for the EmaIndicator class.
    rsi_indicator: Tests for the RsiIndicator class.
    adx_indicator: Tests for the AdxIndicator class.
    atr_indicator: Tests for the AtrIndicator class.

    # Strategy Manager - Rules
    ma_crossover_rule: Tests for the MaCrossoverRule class.
    rsi_threshold_rule: Tests for the RsiThresholdRule class.
    adx_threshold_rule: Tests for the AdxThresholdRule class.
    atr_threshold_rule: Tests for the AtrThresholdRule class.

    # Strategy Manager - Strategies
    base_strategy: Tests for the Strategy base class.
    sma_strategy: Tests for the SmaStrategy class.
    precision_trend_strategy: Tests for the PrecisionTrendStrategy class.
    warmup_candles: Tests for the warmup_candles property on strategy classes.

    # Strategy Manager - Factory
    factory: Tests for the strategy factory function.

    # Scripts
    scripts: Tests for CLI scripts.
    register_bot: Tests for the register_bot script.